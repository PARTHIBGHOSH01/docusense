services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docusense
      POSTGRES_USER: docusense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docusense -d docusense"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://docusense:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/docusense
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:5173
      MAX_UPLOAD_MB: 15
    ports: ["8000:8000"]
    volumes: ["document_data:/data"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  document_data:
